  return typeof crypto !== "undefined" && crypto.randomUUID
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function formatPhoneDisplay(n) {
  const digits = n.replace(/[^\d]/g, "");
  const cc = digits.slice(0, 3);
  const rest = digits.slice(3);
  const grouped = rest.replace(/(\d{2})(?=\d)/g, "$1 ").trim();
  return "+" + cc + " " + grouped;
}

function formatFCFA(n) {
  const sign = n < 0 ? "-" : "";
  const abs = Math.abs(Math.round(n));
  return sign + abs.toLocaleString("fr-FR") + " FCFA";
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("fr-FR", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
  }) + " à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
}

// Un membre peut cumuler plusieurs engagements (catégories) qui s'additionnent
// pour former son montant total à payer. Chaque engagement suit désormais
// son propre montant payé, pour pouvoir préciser à quelle cotisation un
// paiement s'applique. Les fiches créées avant cette fonctionnalité n'ont
// qu'une catégorie/montant/paid unique : on la transforme ici en engagement
// unique pour un affichage et un traitement uniformes.
function getEngagements(member) {
  if (Array.isArray(member.engagements) && member.engagements.length > 0) {
    return member.engagements.map((e) => ({
      ...e,
      paid: typeof e.paid === "number" ? e.paid : 0,
    }));
  }
  return [
    {
      id: "legacy",
      category: member.category,
      target: member.target,
      paid: member.paid,
    },
  ];
}

function categoriesLabel(member) {
  return getEngagements(member)
    .map((e) => e.category)
    .join(" + ");
}

function initials(name) {
  return name
    .trim()
    .split(/\s+/)
    .slice(0, 2)
    .map((w) => w[0])
    .join("")
    .toUpperCase();
}

  const [newCategory, setNewCategory] = useState(CATEGORIES[0]);
  const [payAmounts, setPayAmounts] = useState({});
  const [payEngagementId, setPayEngagementId] = useState({});
  const [openMemberId, setOpenMemberId] = useState(null);
  const [historyOpenId, setHistoryOpenId] = useState(null);
  const [receipt, setReceipt] = useState(null);
  const [agentName, setAgentName] = useState("");

  const [deleteCode, setDeleteCode] = useState("1234");
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [codeInput, setCodeInput] = useState("");
  const [codeError, setCodeError] = useState(false);

  const [showChangeCode, setShowChangeCode] = useState(false);
  const [currentCodeInput, setCurrentCodeInput] = useState("");
  const [newCodeInput, setNewCodeInput] = useState("");
  const [changeCodeError, setChangeCodeError] = useState("");

  // Ajout d'un engagement supplémentaire sur une fiche déjà existante :
  // la nouvelle catégorie/montant vient s'ajouter à ce que le membre doit déjà.
  const [openEngagementId, setOpenEngagementId] = useState(null);
  const [engagementInputs, setEngagementInputs] = useState({});

  // Statut réseau : purement informatif, Firestore continue de fonctionner
  // hors-ligne (cache local + file d'attente d'écritures) dans tous les cas.
  useEffect(() => {
    function goOnline() { setIsOnline(true); }
    function goOffline() { setIsOnline(false); }
    window.addEventListener("online", goOnline);
    window.addEventListener("offline", goOffline);
    return () => {
      window.removeEventListener("online", goOnline);
      window.removeEventListener("offline", goOffline);
    };
  }, []);

  // Écoute en temps réel de la liste des membres. Chaque membre est un
  // document indépendant : une mise à jour sur un appareil ne touche jamais
  // les fiches des autres, et tous les appareils reçoivent le changement
  // automatiquement, sans avoir besoin de recharger la page.
  useEffect(() => {
    const unsubscribe = db
      .collection("members")
      .orderBy("createdAt", "asc")
      .onSnapshot(
        (snapshot) => {
          const list = snapshot.docs.map((doc) => ({
            id: doc.id,
            payments: [],
            ...doc.data(),
          }));
          setMembers(list);
          setLoading(false);
          setSyncError(false);
        },
        (err) => {
          console.error("Erreur de synchronisation :", err);
          setSyncError(true);
          setLoading(false);
        }
      );
    return () => unsubscribe();
  }, []);

  // Écoute du code de suppression partagé (même code sur tous les appareils).
  useEffect(() => {
    const ref = db.collection("settings").doc("config");
    const unsubscribe = ref.onSnapshot((doc) => {
      if (doc.exists && doc.data().deleteCode) {
        setDeleteCode(doc.data().deleteCode);
      } else {
        ref.set({ deleteCode: "1234" }, { merge: true }).catch(() => {});
      }
    });
    return () => unsubscribe();
  }, []);

  const totals = useMemo(() => {
    return members.reduce(
      (acc, m) => {
        acc.target += m.target;
        acc.paid += m.paid;
        return acc;
      },
      { target: 0, paid: 0 }
    );
  }, [members]);

  async function addMember(e) {
    e.preventDefault();
    const t = parseFloat(newTarget);
    if (!newName.trim() || !newTarget || isNaN(t) || t <= 0) return;
    const docData = {
      name: newName.trim(),
      target: t,
      paid: 0,
      category: newCategory,
      engagements: [{ id: makeId(), category: newCategory, target: t, paid: 0 }],
      photo: null,
      payments: [],
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    };
    setNewName("");
    setNewTarget("");
    setNewCategory(CATEGORIES[0]);
    try {
      const ref = await db.collection("members").add(docData);
      setOpenMemberId(ref.id);
    } catch (err) {
      console.error("Erreur d'ajout :", err);
    }
  }

  // Chaque paiement est ajouté par une écriture atomique côté serveur
  // (increment + arrayUnion) : si deux appareils enregistrent un paiement
  // pour la même personne au même moment, ou même hors connexion, les deux
  // paiements sont conservés — aucun n'écrase l'autre. Le paiement est
  // rattaché à un engagement précis (une catégorie) choisi par l'utilisateur,
  // pour savoir exactement quelle cotisation il couvre.
  async function registerPayment(memberId) {
    const raw = payAmounts[memberId];
    const n = parseFloat(raw);
    if (!raw || isNaN(n) || n <= 0) return;

    const member = members.find((m) => m.id === memberId);
    if (!member) return;

    const engagements = getEngagements(member);
    const unpaidEngagements = engagements.filter((e) => e.target - e.paid > 0);
    if (unpaidEngagements.length === 0) return;

    const chosenId = payEngagementId[memberId] || unpaidEngagements[0].id;
    const engagement =
      engagements.find((e) => e.id === chosenId) || unpaidEngagements[0];
    const remaining = engagement.target - engagement.paid;
    if (remaining <= 0) return;
    const amountToAdd = Math.min(n, remaining);
    const paymentDate = new Date().toISOString();
    const enregistrePar = agentName.trim() || "Non renseigné";
    const payment = {
      id: makeId(),
      amount: amountToAdd,
      date: paymentDate,
      enregistrePar,
      category: engagement.category,
    };
    const newPaidTotal = member.paid + amountToAdd;
    const updatedEngagements = engagements.map((e) =>
      e.id === engagement.id ? { ...e, paid: e.paid + amountToAdd } : e
    );

    setPayAmounts((prev) => ({ ...prev, [memberId]: "" }));
    setPayEngagementId((prev) => ({ ...prev, [memberId]: null }));
    setReceipt({
      name: member.name,
      category: engagement.category,
      amount: amountToAdd,
      date: paymentDate,
      paidTotal: newPaidTotal,
      target: member.target,
      reste: Math.max(0, member.target - newPaidTotal),
      enregistrePar,
    });

    try {
      await db
        .collection("members")
        .doc(memberId)
        .update({
          paid: firebase.firestore.FieldValue.increment(amountToAdd),
          engagements: updatedEngagements,
          payments: firebase.firestore.FieldValue.arrayUnion(payment),
        });
    } catch (err) {
      console.error("Erreur d'enregistrement du paiement :", err);
    }
  }

  // Ajoute un nouvel engagement (catégorie + montant) à une fiche déjà
  // existante. Le montant vient s'additionner au montant fixé du membre —
  // écriture atomique côté serveur, comme pour les paiements.
  async function addEngagement(memberId) {
    const input = engagementInputs[memberId] || {};
    const cat = input.category || CATEGORIES[0];
    const amt = parseFloat(input.amount);
    if (!input.amount || isNaN(amt) || amt <= 0) return;

    const member = members.find((m) => m.id === memberId);
    if (!member) return;
    const newEngagement = { id: makeId(), category: cat, target: amt, paid: 0 };

    setEngagementInputs((prev) => ({
      ...prev,
      [memberId]: { category: CATEGORIES[0], amount: "" },
    }));
    setOpenEngagementId(null);

    try {
      if (Array.isArray(member.engagements) && member.engagements.length > 0) {
        await db
          .collection("members")
          .doc(memberId)
          .update({
            target: firebase.firestore.FieldValue.increment(amt),
            engagements: firebase.firestore.FieldValue.arrayUnion(newEngagement),
          });
      } else {
        // Fiche créée avant cette fonctionnalité : on convertit d'abord son
        // engagement unique existant pour ne pas le perdre.
        const legacyEngagement = {
          id: "legacy",
          category: member.category,
          target: member.target,
          paid: member.paid,
        };
        await db
          .collection("members")
          .doc(memberId)
          .update({
            target: firebase.firestore.FieldValue.increment(amt),
            engagements: [legacyEngagement, newEngagement],
          });
      }
    } catch (err) {
      console.error("Erreur d'ajout d'engagement :", err);
    }
  }

  async function deleteMember(memberId) {

      "==============================",

    const contenu = lignes.join("\n");

    document.body.appendChild(a);

    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // La photo est redimensionnée avant l'envoi pour rester légère (les

  function handlePhotoChange(memberId, e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxSize = 200;
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const resized = canvas.toDataURL("image/jpeg", 0.75);
        db.collection("members")
          .doc(memberId)
          .update({ photo: resized })
          .catch((err) => console.error("Erreur photo :", err));

      img.src = reader.result;
    };
    reader.readAsDataURL(file);

                <div style={{ fontSize: 8, letterSpacing: 1.5 }}>EPBOMI</div>
                <div style={{ fontSize: 15, margin: "1px 0" }}>PAYÉ</div>
                <div style={{ fontSize: 7 }}>{receipt.date.split("T")[0].split("-").reverse().join("/")}</div>
              </div>
            </div>

            {/* En-tête avec logo sur fond blanc */}
            <div style={{ textAlign: "center", marginBottom: 10 }}>
              <img
                src={LOGO_DATA_URL}
                alt="EPBOMI"
                style={{
                  height: 56,
                  display: "block",
                  margin: "0 auto 6px auto",
                }}
              />
              <div
                style={{
                  fontFamily: "'Trebuchet MS', sans-serif",
                  fontWeight: 700,
                  fontSize: 13,
                  letterSpacing: 2,
                  color: COLORS.ink,
                }}
              >
                EPBOMI
              </div>
            </div>

            <div
              style={{
                textAlign: "center",
                fontFamily: "'Trebuchet MS', sans-serif",
                fontSize: 11,
                letterSpacing: 3,
                textTransform: "uppercase",
                color: COLORS.green,
                marginBottom: 4,
              }}
            >
              ✓ Paiement enregistré
            </div>
            <div
              style={{
                textAlign: "center",
                fontFamily: "'Georgia', serif",
                fontWeight: 700,
                fontSize: 18,
                marginBottom: 16,
              }}
            >
              Reçu de cotisation
            </div>

            <div style={{ borderTop: `1px dashed ${COLORS.goldBright}`, paddingTop: 12, marginBottom: 8 }}>
              <ReceiptLine label="Membre" value={receipt.name} />
              <ReceiptLine label="Catégorie" value={receipt.category} />
              <ReceiptLine label="Date" value={formatDate(receipt.date)} />
              <ReceiptLine label="Enregistré par" value={receipt.enregistrePar} />
            </div>

            <div style={{ borderTop: `1px dashed ${COLORS.goldBright}`, paddingTop: 12, marginBottom: 8 }}>
              <ReceiptLine label="Montant versé" value={formatFCFA(receipt.amount)} highlight />
              <ReceiptLine label="Total déjà payé" value={formatFCFA(receipt.paidTotal)} />
              <ReceiptLine label="Montant fixé" value={formatFCFA(receipt.target)} />
              <ReceiptLine
                label="Reste à payer"
                value={formatFCFA(receipt.reste)}
                highlight={receipt.reste === 0}
                highlightColor={receipt.reste === 0 ? COLORS.green : COLORS.burgundy}
              />
            </div>

            <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
              <button
                onClick={() => downloadReceipt(receipt)}
                style={{
                  flex: 1,
                  padding: "12px",
                  borderRadius: 3,
                  border: "none",
                  background: COLORS.green,
                  color: COLORS.parchment,
                  fontFamily: "'Trebuchet MS', sans-serif",
                  fontWeight: 700,
                  fontSize: 13,
                  letterSpacing: 1,
                  textTransform: "uppercase",
                  cursor: "pointer",
                }}
              >
                Télécharger
              </button>
              <button
                onClick={() => setReceipt(null)}
                style={{
                  flex: 1,
                  padding: "12px",
                  borderRadius: 3,
                  border: "none",
                  background: COLORS.gold,
                  color: COLORS.inkDeep,
                  fontFamily: "'Trebuchet MS', sans-serif",
                  fontWeight: 700,
                  fontSize: 13,
                  letterSpacing: 1,
                  textTransform: "uppercase",
                  cursor: "pointer",
                }}
              >
                Fermer
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Modale : confirmation de suppression par code */}
      {confirmDeleteId !== null && (
        <div
          onClick={cancelDelete}
          style={{
            position: "fixed",
            inset: 0,
            background: "rgba(16,27,41,0.75)",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            zIndex: 1000,
            padding: 16,
          }}
        >
          <div
            onClick={(e) => e.stopPropagation()}
            style={{
              background: COLORS.parchment,
              color: COLORS.ink,
              borderRadius: 6,
              border: `1px solid ${COLORS.goldBright}`,
              padding: 22,
              width: "100%",
              maxWidth: 340,
              boxShadow: "0 20px 50px rgba(0,0,0,0.5)",
            }}
          >
            <div
              style={{
                fontFamily: "'Trebuchet MS', sans-serif",
                fontWeight: 700,
                fontSize: 15,
                marginBottom: 6,
                color: COLORS.burgundy,
              }}
            >
              🔒 Confirmation requise
            </div>
            <div style={{ fontSize: 13.5, marginBottom: 14, lineHeight: 1.4 }}>
              Entrez le code de suppression pour supprimer{" "}
              <strong>
                {members.find((m) => m.id === confirmDeleteId)?.name}
              </strong>
              . Cette action est définitive.
            </div>
            <input
              type="password"
              inputMode="numeric"
              autoFocus
              value={codeInput}
              onChange={(e) => {
                setCodeInput(e.target.value);
                setCodeError(false);
              }}
              placeholder="Code"
              style={{
                width: "100%",
                boxSizing: "border-box",
                padding: "10px 12px",
                marginBottom: 8,
                borderRadius: 3,
                border: `1px solid ${codeError ? COLORS.burgundy : "rgba(27,42,61,0.25)"}`,
                background: "rgba(27,42,61,0.04)",
                color: COLORS.ink,
                fontFamily: "'Courier New', monospace",
                fontSize: 16,
                letterSpacing: 2,
                outline: "none",
              }}
            />
            {codeError && (
              <div
                style={{
                  color: COLORS.burgundy,
                  fontSize: 12,
                  marginBottom: 10,
                }}
              >
                Code incorrect. Réessayez.
              </div>
            )}
            <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
              <button
                onClick={confirmDelete}
                style={{
                  flex: 1,
                  padding: "10px",
                  borderRadius: 3,
                  border: "none",
                  background: COLORS.burgundy,
                  color: COLORS.parchment,
                  fontFamily: "'Trebuchet MS', sans-serif",
                  fontWeight: 700,
                  fontSize: 12,
                  letterSpacing: 0.5,
                  textTransform: "uppercase",
                  cursor: "pointer",
                }}
              >
                Supprimer
              </button>
              <button
                onClick={cancelDelete}
                style={{
                  flex: 1,
                  padding: "10px",
                  borderRadius: 3,
                  border: "1px solid rgba(27,42,61,0.25)",
                  background: "transparent",
                  color: COLORS.ink,
                  fontFamily: "'Trebuchet MS', sans-serif",
                  fontSize: 12,
                  cursor: "pointer",
                }}
              >
                Annuler
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Modale : changement du code de suppression */}
      {showChangeCode && (
        <div
          onClick={() => setShowChangeCode(false)}
          style={{
            position: "fixed",
            inset: 0,
            background: "rgba(16,27,41,0.75)",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            zIndex: 1000,
            padding: 16,
          }}
        >
          <form
            onClick={(e) => e.stopPropagation()}
            onSubmit={applyChangeCode}
            style={{
              background: COLORS.parchment,
              color: COLORS.ink,
              borderRadius: 6,
              border: `1px solid ${COLORS.goldBright}`,
              padding: 22,
              width: "100%",
              maxWidth: 340,
              boxShadow: "0 20px 50px rgba(0,0,0,0.5)",
            }}
          >
            <div
              style={{
                fontFamily: "'Trebuchet MS', sans-serif",
                fontWeight: 700,
                fontSize: 15,
                marginBottom: 14,
                color: COLORS.burgundy,
              }}
            >
              🔒 Changer le code de suppression
            </div>
            <input
              type="password"
              inputMode="numeric"
              value={currentCodeInput}
              onChange={(e) => setCurrentCodeInput(e.target.value)}
              placeholder="Code actuel"
              style={{
                width: "100%",
                boxSizing: "border-box",
                padding: "10px 12px",
                marginBottom: 10,
                borderRadius: 3,
                border: "1px solid rgba(27,42,61,0.25)",
                background: "rgba(27,42,61,0.04)",
                color: COLORS.ink,
                fontFamily: "'Courier New', monospace",
                fontSize: 15,
                outline: "none",
              }}
            />
            <input
              type="password"
              inputMode="numeric"
              value={newCodeInput}
              onChange={(e) => setNewCodeInput(e.target.value)}
              placeholder="Nouveau code (min. 4 caractères)"
              style={{
                width: "100%",
                boxSizing: "border-box",
                padding: "10px 12px",
                marginBottom: 8,
                borderRadius: 3,
                border: "1px solid rgba(27,42,61,0.25)",
                background: "rgba(27,42,61,0.04)",
                color: COLORS.ink,
                fontFamily: "'Courier New', monospace",
                fontSize: 15,
                outline: "none",
              }}
            />
            {changeCodeError && (
              <div
                style={{
                  color: COLORS.burgundy,
                  fontSize: 12,
                  marginBottom: 10,
                }}
              >
                {changeCodeError}
              </div>
            )}
            <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
              <button
                type="submit"
                style={{
                  flex: 1,
                  padding: "10px",
                  borderRadius: 3,
                  border: "none",
                  background: COLORS.green,
                  color: COLORS.parchment,
                  fontFamily: "'Trebuchet MS', sans-serif",
                  fontWeight: 700,
                  fontSize: 12,
                  letterSpacing: 0.5,
                  textTransform: "uppercase",
                  cursor: "pointer",
                }}
              >
                Valider
              </button>
              <button
                type="button"
                onClick={() => setShowChangeCode(false)}
                style={{
                  flex: 1,
                  padding: "10px",
                  borderRadius: 3,
                  border: "1px solid rgba(27,42,61,0.25)",
                  background: "transparent",
                  color: COLORS.ink,
                  fontFamily: "'Trebuchet MS', sans-serif",
                  fontSize: 12,
                  cursor: "pointer",
                }}
              >
                Annuler
              </button>
            </div>
          </form>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
    </script>
  </body>
</html>
